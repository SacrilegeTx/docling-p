[project]
name = "docling-p"
version = "0.1.0"
description = "Convert PDF and office documents to Markdown with Docling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.91.0",
    "fastapi>=0.115",
    "lxml>=4.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pypdf[crypto]>=6.10.2",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
